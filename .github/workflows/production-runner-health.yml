name: Production runner health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: magicpodcast-production-runner-health
  cancel-in-progress: true

jobs:
  runner-health:
    name: Check production runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check runner evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/production-runner-health.mjs
