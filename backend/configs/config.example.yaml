# MagicPodcast 后端配置文件示例
# 复制此文件为 config.yaml 并根据实际情况修改

server:
  # 仅允许本机访问；公网流量必须经 Cloudflare Tunnel 和 Access。
  host: "127.0.0.1"
  # 服务监听端口
  port: 8080
  # 运行模式: debug, release
  mode: debug
  # 读取超时（秒）
  read_timeout: 60
  # 写入超时（秒）
  write_timeout: 60
  # CORS安全配置
  cors:
    enabled: true
    # 允许的跨域来源
    # 开发环境使用localhost，生产环境请替换为实际域名
    allow_origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      # 生产环境示例（去掉注释并配置实际域名）:
      # - "https://yourdomain.com"
      # - "https://www.yourdomain.com"
    # 允许的HTTP方法
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    # 允许的请求头
    allow_headers:
      - "Origin"
      - "Content-Type"
      - "Authorization"
      - "Accept"
      - "X-Requested-With"
    # 暴露的响应头
    expose_headers:
      - "Content-Length"
    # 是否允许携带凭证（cookies、authorization headers等）
    allow_credentials: true
    # 预检请求缓存时间（秒）
    max_age: 86400

database:
  # SQLite 数据库文件路径
  path: ./data/magicpodcast.db
  # 是否开启调试模式（打印 SQL）。日常运行建议关闭。
  debug: false
  # SQLite 单文件运行固定单连接，避免写竞争和每连接 PRAGMA 不一致
  max_idle_conns: 1
  # SQLite 单文件运行固定单连接
  max_open_conns: 1
  # 写竞争等待时间（毫秒）
  busy_timeout_ms: 5000
  # 连接最大存活时间（秒）
  conn_max_lifetime: 3600

xyz_api:
  # 小宇宙 API 服务地址
  url: http://localhost:8081
  # 请求超时（秒）
  timeout: 30
  # 最大重试次数
  max_retries: 3
  # 重试间隔（毫秒）
  retry_interval: 1000

sync:
  # 是否启用定时同步
  enabled: true
  # Cron 表达式（默认每天凌晨 2 点）
  schedule: "0 2 * * *"
  # 每次同步的并发数
  concurrency: 5
  # 请求间隔（毫秒）
  request_interval: 2000
  # 单次最大同步节目数（0 表示不限制）
  max_podcasts: 0

logging:
  # 日志级别: debug, info, warn, error
  level: info
  # 日志格式: json, text
  format: text
  # 日志输出路径（空表示输出到标准输出）
  output: ""
  # 是否启用文件轮转
  rotate: true
  # 最大文件大小（MB）
  max_size: 100
  # 最大保留天数
  max_age: 30
  # 最大保留文件数
  max_backups: 10

# 用户自定义配置
user:
  # 小宇宙手机号（用于登录）
  phone: ""
  # 小宇宙访问令牌（登录后自动保存）
  access_token: ""
  # 令牌刷新令牌
  refresh_token: ""

# 邮件通知配置
email:
  # 是否启用邮件通知
  enabled: false
  # SMTP服务器地址
  # 网易163: smtp.163.com
  # QQ邮箱: smtp.qq.com
  # Gmail: smtp.gmail.com
  smtp_host: "smtp.163.com"
  # SMTP端口（465为SSL端口，587为TLS端口）
  smtp_port: 465
  # 发件邮箱账号
  username: "your-email@163.com"
  # 邮箱SMTP授权码（注意：不是邮箱密码，需要去邮箱设置中获取）
  # 网易邮箱获取方式：设置 -> POP3/SMTP/IMAP -> 开启SMTP服务 -> 获取授权码
  password: "YOUR_AUTHORIZATION_CODE"
  # 发件人显示名称
  from: "MagicPodcast <your-email@163.com>"
  # 收件邮箱地址
  to: "recipient@example.com"
  # 是否使用TLS/SSL加密
  use_tls: true

# LLM智能摘要配置
llm:
  # 是否启用LLM功能（总开关）
  enabled: true
  # API提供商
  provider: "deepseek"
  # API密钥（建议使用环境变量 MAGICPODCAST_LLM_API_KEY）
  api_key: "YOUR_DEEPSEEK_API_KEY_HERE"
  # API Base URL
  base_url: "https://api.deepseek.com"
  # 默认模型
  default_model: "deepseek-v4-flash"
  # 请求超时（秒）
  timeout: 60
  # 最大重试次数
  max_retries: 2
  # 重试间隔（毫秒）
  retry_interval: 1000
  # 并发限制
  max_concurrent: 3
  # 速率限制（每分钟请求数）
  rate_limit_per_minute: 30
  # 单次请求token限制
  max_tokens_per_request: 2000
  # Prompt模板目录
  prompts_dir: "./configs/prompts"
  # 全局System Prompt（所有工作流共享）
  system_prompt: |
    你是播客内容分析专家。请基于提供的播客数据生成分析内容。

    约束：
    1. 仅基于提供的数据进行分析，不编造信息
    2. 对不确定的内容使用"可能"、"疑似"等谨慎表述
    3. 不涉及政治、宗教、暴力等敏感内容
    4. 保持客观中立的立场

# Feed 抓取可靠性配置（启动期一次性加载，无热更新；改任何值都需要重启）
# 本节缺省时全部走已验证的诚实默认值，行为与之前完全一致。
# 任意叶子键都可用 MAGICPODCAST_FEED_* 环境变量覆盖，环境变量优先级高于此文件。
# 这里只承载有界的、塑性行为的取值；完整 Feed URL、响应正文、Cookie、凭据或
# 任意响应头都不属于本配置。
feed:
  # User-Agent：诚实标识，不要伪装成浏览器。
  user_agent: "MagicPodcast/1.0 (+https://github.com/rookiestar/MagicPodcast)"
  # 分层 HTTP 超时；任一层快速失败，避免慢响应耗尽整个请求预算。
  timeouts:
    connect: "10s"
    tls: "10s"
    header: "20s"
    overall: "30s"
  # 诚实、低负载的请求头。Accept-Encoding 故意不设置：Go 的 http.Transport
  # 会透明协商并解压 gzip，显式设置反而会关闭该行为。
  headers:
    accept: "application/rss+xml, application/atom+xml, application/xml;q=0.9, */*;q=0.8"
    accept_language: ""
  # 外层重试预算（叠在 Coordinator 断路之上，由 feed.RetryPolicy 统一执行）。
  # budget 是单个 Feed 在一次工作流步骤内首次失败后的最大重试次数（总尝试次数
  # = budget + 1）。留空/为 0 表示沿用已验证默认值 3（保持既有 MaxRetries=3 行为），
  # 取值范围 [0, 5]，任何配置都无法产生无限重试。
  # jitter 是 full-jitter 指数退避的基准；留空/为 0 沿用默认 2s，等待时间硬封顶
  # 在 8s 与全局上限 60s。429/5xx 且上游给出 Retry-After 时，该值优先于退避。
  retry:
    budget: 0
    jitter: "0s"
  # 断路恢复全局默认值；未在 domain_policies 中覆盖的域名都使用这些取值。
  # 留空/为 0 时走已验证默认值，绝不扩大断路范围。
  circuit:
    half_open_max: 0
    successes_to_close: 0
    domain_evidence_min_distinct_feeds: 0
    # thresholds_per_category 为保留映射，留空即保持现有断路逻辑；
    # 显式填写为运营方主动 opt-in，key 必须是已知错误类别且 value >= 1。
    thresholds_per_category: {}
  # last-good 兜底快照存储。durable 缺省为 true（feed_snapshots 表存在时落盘，
  # 进程重启后仍可恢复）；显式 durable:false 才退出落盘。
  snapshot:
    durable: true
    bounds:
      max_entries: 0
      max_response_bytes: 0
      max_total_bytes: 0
  # 受保护的 Admin 诊断视图与出口观测标签。
  # admin_enabled 缺省为 true（路由注册）；显式 false 才去注册该路由，
  # 但 /health 与 /ready 语义保持不变。访问控制仍依赖 loopback 绑定 +
  # Cloudflare Access。
  # configured_egress_label 仅是配置标签，缺省为 "direct"，
  # 不构成真实公网出口的证明。
  diagnostics:
    admin_enabled: true
    configured_egress_label: "direct"
  # 启动期可调的、按域名的作用域塑性策略，映射到 DomainPolicy 中可安全调整的字段。
  # ImmediateCircuitOnAccessDenied 故意不在此暴露：feed.xyzfm.space 的首 403 立即
  # 开断路规则是不可放松的安全不变量，任何配置都必须保留。
  domain_policies: []
  # domain_policies 示例（非安全字段可调）：
  # - domain: "feed.example.com"
  #   max_concurrency: 2
  #   min_refresh_interval: "30m"
  #   max_jitter: "2m"
  #   circuit_cooldown: "60s"
  #   retry_backoff_initial: "1s"
  #   retry_backoff_max: "30s"
  #   half_open_max_requests: 1
  #   successes_to_close: 2
  #   domain_evidence_min_distinct_feeds: 1
  #   evidence_window: "5m"
  # 集合型 ENV 覆盖使用 JSON 字符串（时长字段使用 Go duration，例如 "30m"）：
  # MAGICPODCAST_FEED_CIRCUIT_THRESHOLDS_PER_CATEGORY='{"service_unavailable":2}'
  # MAGICPODCAST_FEED_DOMAIN_POLICIES='[{"domain":"feed.example.com","max_concurrency":2,"min_refresh_interval":"30m"}]'
