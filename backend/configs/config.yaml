# MagicPodcast 后端配置文件示例
# 复制此文件为 config.yaml 并根据实际情况修改

server:
  # 服务监听端口
  port: 8080
  # 运行模式: debug, release
  mode: debug
  # 读取超时（秒）- 增加到10分钟以支持长时间SSE
  read_timeout: 600
  # 写入超时（秒）- 增加到10分钟以支持长时间SSE
  write_timeout: 600
  # CORS安全配置
  cors:
    enabled: true
    # 允许的跨域来源（开发环境使用localhost + 局域网IP）
    # 生产环境应该配置具体的域名，不要使用 "*"
    allow_origins:
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "http://localhost:3001"
      - "http://127.0.0.1:3001"
      - "http://localhost:3002"
      - "http://127.0.0.1:3002"
      - "http://192.168.3.58:3000"  # 局域网访问
      - "https://posting-hair-postcard-victoria.trycloudflare.com"  # Cloudflare Tunnel
    # 允许的HTTP方法
    allow_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    # 允许的请求头
    allow_headers:
      - "Origin"
      - "Content-Type"
      - "Authorization"
      - "Accept"
      - "X-Requested-With"
    # 暴露的响应头
    expose_headers:
      - "Content-Length"
    # 是否允许携带凭证（cookies、authorization headers等）
    allow_credentials: true
    # 预检请求缓存时间（秒）
    max_age: 86400

database:
  # SQLite 数据库文件路径
  path: ./data/magicpodcast.db
  # 是否开启调试模式（打印 SQL）
  debug: true
  # 连接池最大空闲连接数
  max_idle_conns: 10
  # 连接池最大打开连接数
  max_open_conns: 100
  # 连接最大存活时间（秒）
  conn_max_lifetime: 3600

xyz_api:
  # 小宇宙 API 服务地址
  url: http://localhost:8081
  # 请求超时（秒）
  timeout: 30
  # 最大重试次数
  max_retries: 3
  # 重试间隔（毫秒）
  retry_interval: 1000

sync:
  # 是否启用定时同步
  enabled: true
  # Cron 表达式（默认每天凌晨 2 点）
  schedule: "0 2 * * *"
  # 每次同步的并发数
  concurrency: 5
  # 请求间隔（毫秒）
  request_interval: 2000
  # 单次最大同步节目数（0 表示不限制）
  max_podcasts: 0

podcast_index:
  # PodcastIndex 数据库文件路径（可选，留空则不使用）
  # 从 https://github.com/Podcastindex-org/database 下载
  path: "./data/podcastindex_feeds.db"

logging:
  # 日志级别: debug, info, warn, error
  level: info
  # 日志格式: json, text
  format: text
  # 日志输出路径（空表示输出到标准输出）
  output: ""
  # 是否启用文件轮转
  rotate: true
  # 最大文件大小（MB）
  max_size: 100
  # 最大保留天数
  max_age: 30
  # 最大保留文件数
  max_backups: 10

# 搜索配置
search:
  # 字段权重
  weights:
    podcast_title: 1.0
    episode_title: 1.0
    author: 0.8
    podcast_desc: 0.7
    episode_content: 0.7
  # 匹配类型加权
  match_multipliers:
    exact: 1.5      # 完全匹配
    prefix: 1.2     # 前缀匹配
    contains: 1.0   # 包含匹配
    occurrence: 0.1 # 每次额外出现的加分
  # 分页默认值
  default_page_size: 20
  max_page_size: 100

# 用户自定义配置
user:
  # 小宇宙手机号（用于登录）
  phone: ""
  # 小宇宙访问令牌（登录后自动保存）
  access_token: ""
  # 令牌刷新令牌
  refresh_token: ""

# 邮件通知配置
email:
  # 是否启用邮件通知
  enabled: true
  # SMTP服务器地址（163邮箱）
  smtp_host: "smtp.163.com"
  # SMTP端口（465为SSL端口，587为TLS端口）
  smtp_port: 465
  # 发件邮箱账号
  username: "rookiestar@163.com"
  # 邮箱SMTP授权码（注意：不是邮箱密码，需要去邮箱设置中获取）
  password: "RZ3aH9vhFmtMgREQ"
  # 发件人显示名称
  from: "MagicPodcast <rookiestar@163.com>"
  # 收件邮箱地址
  to: "rookiestar@163.com"
  # 是否使用TLS/SSL加密
  use_tls: true

# LLM智能摘要配置
llm:
  # 是否启用LLM功能（总开关）
  enabled: true

  # API提供商
  provider: "zhipuai"

  # API密钥（建议使用环境变量 MAGICPODCAST_LLM_API_KEY）
  # 如果未设置环境变量，将使用此占位符值（会导致认证失败）
  api_key: "YOUR_ZHIPUAI_API_KEY_HERE"

  # API Base URL
  base_url: "https://open.bigmodel.cn/api/paas/v4"

  # 默认模型
  default_model: "glm-4.5-air"

  # 请求超时（秒）- 增加到120秒以支持大量数据生成
  timeout: 120

  # 最大重试次数
  max_retries: 2

  # 重试间隔（毫秒）
  retry_interval: 1000

  # 并发限制
  max_concurrent: 3

  # 速率限制（每分钟请求数）
  rate_limit_per_minute: 30

  # 单次请求token限制
  max_tokens_per_request: 2000

  # Prompt模板目录
  prompts_dir: "./configs/prompts"

  # 全局System Prompt（所有工作流共享）
  # 定义AI助手的角色、安全约束和防幻觉提示
  system_prompt: |
    你是播客内容分析专家。请基于提供的播客数据生成分析内容。

    约束：
    1. 仅基于提供的数据进行分析，不编造信息
    2. 对不确定的内容使用"可能"、"疑似"等谨慎表述
    3. 不涉及政治、宗教、暴力等敏感内容
    4. 保持客观中立的立场
